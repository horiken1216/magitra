# Build the Linux version (linux/) and run its unit tests.
# The tests do not need a trackpad: they cover report parsing, gestures, inertia and settings parsing.
# Each Ubuntu release gets its own .deb (Qt's runtime package names differ between releases, so a .deb built on 24.04
# does not install on 26.04). Both key profiles are built: generic and lxqt (the LXQt edition; Lubuntu 26.04 uses
# the 26.04 one). Every .deb is installed in the same container afterwards, with the cmake-installed files removed first.
name: linux

on:
  push:
    branches: ['**']
    paths: ['linux/**', 'core/**', 'agent/mtp_gesture.*', 'agent/mtp_momentum.*', 'agent/tests/**', '.github/workflows/linux.yml']
  pull_request:
    paths: ['linux/**', 'core/**', 'agent/mtp_gesture.*', 'agent/mtp_momentum.*', 'agent/tests/**', '.github/workflows/linux.yml']
  # release.yml から呼ぶ。.deb は同じ実行の成果物（magitra-<profile>-ubuntu<版>-deb）として残り、release.yml が Release に添付する
  workflow_call:
    inputs:
      version:
        description: 'Package version: a tag such as v0.4.0 (the leading v is dropped). Empty = the default in linux/CMakeLists.txt.'
        type: string
        required: false
        default: ''

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        ubuntu: ['24.04', '26.04']
        profile: [generic, lxqt]
    container: ubuntu:${{ matrix.ubuntu }}
    env:
      DEBIAN_FRONTEND: noninteractive
    steps:
      - uses: actions/checkout@v4

      # systemd は systemd-analyze のため（コンテナの中では動かさない）
      - name: Install build dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends build-essential cmake ninja-build qt6-base-dev libsystemd-dev \
            pkg-config dpkg-dev file systemd

      - name: Configure
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
        run: |
          extra=()
          if [ -n "$VERSION" ]; then
            v="${VERSION#v}"
            [[ "$v" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "版の形が違います: $VERSION"; exit 1; }
            extra=(-DMAGITRA_VERSION="$v")
          fi
          cmake -S linux -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=/usr \
            -DMAGITRA_DEFAULT_PROFILE=${{ matrix.profile }} "${extra[@]}"

      - name: Build
        run: cmake --build build

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Install (staging)
        run: DESTDIR="$PWD/stage" cmake --install build && find stage -type f | sort

      - name: Package (.deb)
        run: |
          cd build && cpack -G DEB && dpkg-deb --info ./*.deb && dpkg-deb --contents ./*.deb | tee contents.txt
          # systemd と XDG autostart が読む場所に入っていること
          grep -q ' \./usr/lib/systemd/system/magitrad.service$' contents.txt
          grep -q ' \./etc/xdg/autostart/magitra-tray.desktop$' contents.txt
          grep -q ' \./usr/bin/magitrad$' contents.txt

      # .deb だけを入れて確かめる（このコンテナには cmake --install で何も入れていない）
      - name: Install the .deb and check it
        run: |
          apt-get install -y ./build/*.deb
          exec_start=$(sed -n 's/^ExecStart=//p' /usr/lib/systemd/system/magitrad.service)
          test -x "$exec_start"
          "$exec_start" --version
          # 共有ライブラリがすべて見つかること
          ! ldd /usr/bin/magitrad /usr/bin/magitra-gui | grep 'not found'
          # 常駐サービスの unit ファイルを systemd 自身に確かめさせる（知らない指定・誤りは失敗にする）
          systemd-analyze verify /usr/lib/systemd/system/magitrad.service 2>&1 | tee verify.txt
          ! grep -v '^$' verify.txt
          # postinst が有効にしたこと（コンテナでは systemd が動いていないので、有効化の印で見る）
          test -L /etc/systemd/system/multi-user.target.wants/magitrad.service
          apt-get remove -y "$(dpkg-deb -f build/*.deb Package)"
          test ! -e /usr/bin/magitrad

      - uses: actions/upload-artifact@v4
        with:
          name: magitra-${{ matrix.profile }}-ubuntu${{ matrix.ubuntu }}-deb
          path: build/*.deb
