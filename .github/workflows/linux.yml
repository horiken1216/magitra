# Build the Linux version (linux/) on GitHub's Ubuntu runner and run its unit tests.
# The tests do not need a trackpad: they cover report parsing, gestures, inertia and settings parsing.
# Both key profiles are built: generic and lxqt (the LXQt edition, also packaged as a .deb artifact).
name: linux

on:
  push:
    branches: ['**']
    paths: ['linux/**', 'core/**', 'agent/mtp_gesture.*', 'agent/mtp_momentum.*', 'agent/tests/**', '.github/workflows/linux.yml']
  pull_request:
    paths: ['linux/**', 'core/**', 'agent/mtp_gesture.*', 'agent/mtp_momentum.*', 'agent/tests/**', '.github/workflows/linux.yml']

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        profile: [generic, lxqt]
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake ninja-build qt6-base-dev libsystemd-dev pkg-config dpkg-dev file

      - name: Configure
        run: cmake -S linux -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DMAGITRA_DEFAULT_PROFILE=${{ matrix.profile }}

      - name: Build
        run: cmake --build build

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Install (staging)
        run: DESTDIR="$PWD/stage" cmake --install build && find stage -type f | sort

      # 常駐サービスの unit ファイルを systemd 自身に確かめさせる（知らない指定・誤りは失敗にする）
      - name: Verify systemd unit
        run: |
          sudo cmake --install build
          systemd-analyze verify /usr/lib/systemd/system/magitrad.service 2>&1 | tee verify.txt
          ! grep -v '^$' verify.txt

      - name: Package (.deb)
        run: |
          cd build && cpack -G DEB && dpkg-deb --info ./*.deb && dpkg-deb --contents ./*.deb | tee contents.txt
          # systemd と XDG autostart が読む場所に入っていること
          grep -q ' \./usr/lib/systemd/system/magitrad.service$' contents.txt
          grep -q ' \./etc/xdg/autostart/magitra-tray.desktop$' contents.txt
          grep -q ' \./usr/bin/magitrad$' contents.txt

      - uses: actions/upload-artifact@v4
        with:
          name: magitra-${{ matrix.profile }}-deb
          path: build/*.deb
