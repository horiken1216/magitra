# Build mtpsetup.exe on GitHub's Windows runner.
# - Push a tag "vX.Y.Z": run all unit tests, build mtpsetup.exe, and publish a GitHub Release with the file and its SHA-256.
#   The Linux .deb files (generic and LXQt, for Ubuntu 24.04 and 26.04) are built, tested and install-checked first by
#   linux.yml, and attached to the same release with their SHA-256. The release is not published if they fail.
#   The release text is docs/releases/vX.Y.Z.md (required), followed by the SHA-256 line and the VirusTotal result
#   (when the repository secret VIRUSTOTAL_API_KEY is set).
# - Run by hand (Actions tab → release → Run workflow):
#   - without "scan_release": build and test only, scan with VirusTotal, and keep mtpsetup.exe as a workflow artifact
#   - with "scan_release" = vX.Y.Z: do not build; send that release's mtpsetup.exe to VirusTotal and add the result to its text
#
# Nothing is signed here. mtpsetup.exe signs the drivers (and the UIAccess agent) on the user's PC with a one-time
# certificate, so no certificate is stored in GitHub.
name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      scan_release:
        description: 'Existing release tag to scan with VirusTotal (e.g. v0.3.0). Empty = build and test.'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  linux:
    if: github.event_name == 'push' || inputs.scan_release == ''
    uses: ./.github/workflows/linux.yml
    with:
      version: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}

  build:
    if: github.event_name == 'push' || inputs.scan_release == ''
    needs: linux
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      # The build scripts use Windows SDK / WDK 10.0.26100 at fixed paths (drivers\build.cmd, drivers\*\package.cmd).
      - name: Install Windows SDK and WDK 10.0.26100 if missing
        shell: pwsh
        run: |
          $kits = "${env:ProgramFiles(x86)}\Windows Kits\10"
          $needSdk = -not (Test-Path "$kits\Include\10.0.26100.0\shared")
          $needWdk = -not (Test-Path "$kits\Include\10.0.26100.0\km") -or -not (Test-Path "$kits\bin\10.0.26100.0\x86\Inf2Cat.exe")
          Write-Host "SDK 10.0.26100 missing: $needSdk / WDK 10.0.26100 missing: $needWdk"
          $common = @('--source', 'winget', '--silent', '--accept-package-agreements', '--accept-source-agreements', '--disable-interactivity')
          if ($needSdk) {
            winget install --id Microsoft.WindowsSDK.10.0.26100 @common
            if ($LASTEXITCODE -ne 0) { throw "winget (SDK) failed: $LASTEXITCODE" }
          }
          if ($needWdk) {
            winget install --id Microsoft.WindowsWDK.10.0.26100 @common
            if ($LASTEXITCODE -ne 0) { throw "winget (WDK) failed: $LASTEXITCODE" }
          }
          foreach ($p in "$kits\Include\10.0.26100.0\km", "$kits\Include\wdf\kmdf\1.15", "$kits\bin\10.0.26100.0\x86\Inf2Cat.exe", "$kits\bin\10.0.26100.0\x64\stampinf.exe") {
            if (-not (Test-Path $p)) { throw "still missing: $p" }
          }

      - name: Unit tests and mtpsetup.exe
        shell: cmd
        run: call build.cmd

      - name: SHA-256
        id: hash
        shell: pwsh
        run: |
          $h = (Get-FileHash build\mtpsetup.exe -Algorithm SHA256).Hash
          Write-Host "mtpsetup.exe SHA-256: $h"
          "sha256=$h" >> $env:GITHUB_OUTPUT

      - uses: actions/upload-artifact@v4
        with:
          name: mtpsetup
          path: build/mtpsetup.exe

      # The result never fails the build: some engines flag unsigned installers that change certificates and drivers.
      # If VirusTotal is busy, the release still goes out (with the link only, or without the VirusTotal line).
      - name: VirusTotal
        id: vt
        continue-on-error: true
        shell: pwsh
        env:
          VT_KEY: ${{ secrets.VIRUSTOTAL_API_KEY }}
        run: ./.github/scripts/virustotal.ps1 -Path build/mtpsetup.exe

      # linux.yml（上の linux ジョブ）が作った .deb。名前に Ubuntu の版を入れる（版ごとにファイル名が同じため）
      - uses: actions/download-artifact@v4
        with:
          pattern: magitra-*-deb
          path: linux-debs

      - name: Linux .deb files
        id: debs
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release-debs | Out-Null
          $lines = @()
          foreach ($dir in Get-ChildItem linux-debs -Directory | Sort-Object Name) {
            # magitra-lxqt-ubuntu26.04-deb → ubuntu26.04
            if ($dir.Name -notmatch '-(ubuntu[0-9.]+)-deb$') { throw "成果物の名前が想定と違います: $($dir.Name)" }
            $ubuntu = $Matches[1]
            $debs = @(Get-ChildItem $dir.FullName -Filter *.deb)
            if ($debs.Count -ne 1) { throw "$($dir.Name) に .deb が 1 つではありません" }
            $name = $debs[0].Name -replace '_amd64\.deb$', "_${ubuntu}_amd64.deb"
            Copy-Item $debs[0].FullName "release-debs/$name"
            $lines += '- `' + $name + '`: `' + (Get-FileHash "release-debs/$name" -Algorithm SHA256).Hash + '`'
          }
          if ($lines.Count -ne 4) { throw "Linux の .deb が 4 つそろっていません（$($lines.Count) 個）" }
          ($lines -join "`n") | Set-Content -Path deb-hashes.md -Encoding UTF8
          Get-Content deb-hashes.md

      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          SHA256: ${{ steps.hash.outputs.sha256 }}
          VT_LINK: ${{ steps.vt.outputs.link }}
          VT_SUMMARY: ${{ steps.vt.outputs.summary }}
        run: |
          $notes = "docs/releases/$env:TAG.md"
          if (-not (Test-Path $notes)) { throw "$notes がありません。リリースの本文を書いてからタグを付けてください" }
          $body = (Get-Content $notes -Raw -Encoding UTF8).TrimEnd() + "`n`n" + '`mtpsetup.exe` の SHA-256: `' + $env:SHA256 + '`' + "`n"
          if ($env:VT_LINK) {
            $body += "`nVirusTotal の検査結果: $env:VT_LINK"
            if ($env:VT_SUMMARY) { $body += "（$env:VT_SUMMARY）" }
            $body += "`n"
          }
          $body += "`nLinux 版（[docs/LINUX.md](https://github.com/$env:GITHUB_REPOSITORY/blob/$env:TAG/docs/LINUX.md)）の .deb と SHA-256（Lubuntu 26.04 は magitra-lxqt の ubuntu26.04）:`n`n"
          $body += (Get-Content deb-hashes.md -Raw -Encoding UTF8).TrimEnd() + "`n"
          Set-Content -Path release-body.md -Value $body -Encoding UTF8
          gh release create $env:TAG build/mtpsetup.exe (Get-ChildItem release-debs/*.deb).FullName --title "MAGITRA $($env:TAG.TrimStart('v'))" --notes-file release-body.md --verify-tag

  # Scan the mtpsetup.exe of a release that is already published, and add (or replace) the VirusTotal line in its text.
  scan-release:
    if: github.event_name == 'workflow_dispatch' && inputs.scan_release != ''
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Download the release's mtpsetup.exe
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.scan_release }}
        run: |
          if ($env:TAG -notmatch '^v\d+\.\d+\.\d+$') { throw "scan_release は vX.Y.Z の形で指定してください: $env:TAG" }
          gh release download $env:TAG --repo $env:GITHUB_REPOSITORY --pattern mtpsetup.exe --dir dl
          if ($LASTEXITCODE -ne 0) { throw "gh release download failed: $LASTEXITCODE" }
          Write-Host "SHA-256: $((Get-FileHash dl\mtpsetup.exe -Algorithm SHA256).Hash)"

      - name: VirusTotal
        id: vt
        shell: pwsh
        env:
          VT_KEY: ${{ secrets.VIRUSTOTAL_API_KEY }}
        run: |
          if (-not $env:VT_KEY) { throw 'VIRUSTOTAL_API_KEY is not set' }
          ./.github/scripts/virustotal.ps1 -Path dl/mtpsetup.exe

      - name: Add the result to the release text
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.scan_release }}
          VT_LINK: ${{ steps.vt.outputs.link }}
          VT_SUMMARY: ${{ steps.vt.outputs.summary }}
        run: |
          # gh の出力（日本語）を UTF-8 として受け取る。既定のままだと文字化けした本文で上書きしてしまう
          [Console]::OutputEncoding = [System.Text.Encoding]::UTF8
          $body = (gh release view $env:TAG --repo $env:GITHUB_REPOSITORY --json body --jq .body) -join "`n"
          if ($LASTEXITCODE -ne 0) { throw "gh release view failed: $LASTEXITCODE" }
          if ($body -notmatch '新しくなったこと|SHA-256') { throw "本文を正しく読めませんでした（文字化けの可能性）。何も変更していません" }
          # 以前の VirusTotal の行は置き換える
          $body = (($body -split "`n") | Where-Object { $_ -notlike 'VirusTotal の検査結果:*' }) -join "`n"
          $line = "VirusTotal の検査結果: $env:VT_LINK"
          if ($env:VT_SUMMARY) { $line += "（$env:VT_SUMMARY）" }
          $body = $body.TrimEnd() + "`n`n" + $line + "`n"
          Set-Content -Path release-body.md -Value $body -Encoding UTF8
          gh release edit $env:TAG --repo $env:GITHUB_REPOSITORY --notes-file release-body.md
